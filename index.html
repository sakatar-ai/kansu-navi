<title>関数ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f9;
  --bg-soft:#eceff3;
  --surface:#ffffff;
  --surface-2:#f0f2f6;
  --border:#dde1e8;
  --border-strong:#c7cdd7;
  --ink:#1b222c;
  --ink-muted:#5b6472;
  --ink-faint:#8992a0;
  --accent:#1f6f78;
  --accent-ink:#0f4a50;
  --accent-soft:#e3f0f0;
  --accent-soft-strong:#cbe4e3;
  --code-bg:#f7f8fb;
  --code-border:#e1e5ec;
  --code-fn:#a8571e;
  --code-ref:#2f6fa5;
  --code-str:#3e7d4b;
  --code-num:#7a4fa0;
  --code-punc:#8992a0;
  --tag-sheets-bg:#efe8f7;
  --tag-sheets-ink:#6a4fa0;
  --tag-excel-bg:#e7f1e9;
  --tag-excel-ink:#2f7a45;
  --good:#2f7a45;
  --warn:#b5791a;
  --bad:#b23b3b;
  --shadow: 0 1px 2px rgba(20,30,40,.04), 0 8px 24px -12px rgba(20,30,40,.10);
  --radius: 14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;
    --bg-soft:#171c23;
    --surface:#1a2028;
    --surface-2:#212832;
    --border:#2c3440;
    --border-strong:#3a4451;
    --ink:#e7eaef;
    --ink-muted:#a3adba;
    --ink-faint:#6c7684;
    --accent:#59bcc4;
    --accent-ink:#bfeef0;
    --accent-soft:#173539;
    --accent-soft-strong:#1f4548;
    --code-bg:#161b22;
    --code-border:#2a323d;
    --code-fn:#e0a868;
    --code-ref:#7fb0e0;
    --code-str:#8fcb9b;
    --code-num:#b79ce0;
    --code-punc:#788191;
    --tag-sheets-bg:#2a2338;
    --tag-sheets-ink:#c4aeee;
    --tag-excel-bg:#1d2c22;
    --tag-excel-ink:#7fce97;
    --good:#6fbf86;
    --warn:#d9a949;
    --bad:#e08080;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;
  --bg-soft:#171c23;
  --surface:#1a2028;
  --surface-2:#212832;
  --border:#2c3440;
  --border-strong:#3a4451;
  --ink:#e7eaef;
  --ink-muted:#a3adba;
  --ink-faint:#6c7684;
  --accent:#59bcc4;
  --accent-ink:#bfeef0;
  --accent-soft:#173539;
  --accent-soft-strong:#1f4548;
  --code-bg:#161b22;
  --code-border:#2a323d;
  --code-fn:#e0a868;
  --code-ref:#7fb0e0;
  --code-str:#8fcb9b;
  --code-num:#b79ce0;
  --code-punc:#788191;
  --tag-sheets-bg:#2a2338;
  --tag-sheets-ink:#c4aeee;
  --tag-excel-bg:#1d2c22;
  --tag-excel-ink:#7fce97;
  --good:#6fbf86;
  --warn:#d9a949;
  --bad:#e08080;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;text-wrap:balance;margin:0;}
a{color:inherit;}
code,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;}
::selection{background:var(--accent-soft-strong);}

.app{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:288px;flex:none;
  background:var(--bg-soft);
  border-right:1px solid var(--border);
  padding:22px 16px 24px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:18px;
}
.brand{display:flex;align-items:baseline;gap:10px;padding:0 4px;}
.brand .mark{
  font-family:"Zen Maru Gothic";font-weight:900;font-size:22px;color:var(--accent-ink);
  background:var(--accent-soft);border:1px solid var(--accent-soft-strong);
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
}
.brand .name{font-family:"Zen Maru Gothic";font-weight:700;font-size:19px;letter-spacing:.02em;}
.brand .sub{font-size:11px;color:var(--ink-faint);margin-top:1px;}

.theme-toggle{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;}
.theme-toggle button{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:8px;
  border:none;background:none;color:var(--ink-muted);font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;
}
.theme-toggle button svg{width:14px;height:14px;stroke-width:2;flex:none;}
.theme-toggle button:hover{color:var(--ink);}
.theme-toggle button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:700;}
.theme-toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

.searchbox{position:relative;}
.searchbox input{
  width:100%;padding:11px 14px 11px 38px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink);font-size:14px;font-family:inherit;
}
.searchbox input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-faint);}
.search-meta{font-size:11.5px;color:var(--ink-faint);padding:2px 4px;min-height:14px;}

.navgroup{display:flex;flex-direction:column;gap:2px;}
.navgroup-label{font-size:11px;color:var(--ink-faint);letter-spacing:.08em;padding:10px 8px 4px;font-weight:700;}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  color:var(--ink-muted);font-size:13.5px;font-weight:500;border:1px solid transparent;
  width:100%;text-align:left;background:none;font-family:inherit;
}
.navitem:hover{background:var(--surface-2);color:var(--ink);}
.navitem:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.navitem.active{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft-strong);font-weight:700;}
.navitem .ico{width:17px;height:17px;flex:none;stroke:currentColor;}
.navitem .cnt{margin-left:auto;font-family:"JetBrains Mono";font-size:11px;color:var(--ink-faint);}
.navitem.active .cnt{color:var(--accent-ink);}

.sidebar-foot{margin-top:auto;font-size:11px;color:var(--ink-faint);padding:8px 4px 0;border-top:1px solid var(--border);padding-top:12px;}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;padding:34px 40px 80px;max-width:1180px;}
.page-head{margin-bottom:26px;}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.08em;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.page-title{font-size:27px;font-weight:700;}
.page-desc{color:var(--ink-muted);margin-top:8px;font-size:14px;max-width:70ch;}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;}
.badge-sheets{background:var(--tag-sheets-bg);color:var(--tag-sheets-ink);}
.badge-excel{background:var(--tag-excel-bg);color:var(--tag-excel-ink);}
.badge-cat{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border);}

/* function cards */
.fn-grid{display:flex;flex-direction:column;gap:16px;}
.fn-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px 22px 22px;box-shadow:var(--shadow);scroll-margin-top:20px;
}
@media (prefers-reduced-motion: no-preference){
  html{scroll-behavior:smooth;}
  .fn-card:target{animation:target-flash 1.8s ease-out;}
  @keyframes target-flash{
    0%{box-shadow:0 0 0 3px var(--accent);}
    100%{box-shadow:var(--shadow);}
  }
}
.cmp-link{color:inherit;text-decoration:none;border-bottom:1px dashed var(--border-strong);cursor:pointer;}
.cmp-link:hover{color:var(--accent-ink);border-bottom-color:var(--accent);}
.fn-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.fn-name{font-family:"JetBrains Mono";font-size:18px;font-weight:600;color:var(--ink);}
.fn-oneliner{font-size:13.5px;color:var(--ink-muted);margin-top:3px;}
.fn-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

.codeblock{
  margin-top:14px;background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;
  padding:12px 14px;position:relative;display:flex;flex-direction:column;gap:8px;
}
.codeblock .formula{font-family:"JetBrains Mono";font-size:13.5px;white-space:pre;line-height:1.6;overflow-x:auto;}
.codeblock .note{font-size:12.5px;color:var(--ink-muted);border-top:1px dashed var(--border);padding-top:8px;}
.copy-btn{
  align-self:flex-end;flex:none;background:var(--surface);border:1px solid var(--border);
  border-radius:6px;font-size:11px;padding:4px 8px;color:var(--ink-muted);cursor:pointer;font-family:inherit;
}
.copy-btn:hover{color:var(--accent-ink);border-color:var(--accent-soft-strong);}
.copy-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.searchbox input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
.cf{color:var(--code-fn);} .cr{color:var(--code-ref);} .cs{color:var(--code-str);} .cn{color:var(--code-num);} .cp{color:var(--code-punc);}

.fn-body{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:16px;}
@media (max-width:760px){.fn-body{grid-template-columns:1fr;}}
.fn-main-col{display:flex;flex-direction:column;gap:14px;min-width:0;}
.fn-side-col{display:flex;flex-direction:column;gap:10px;min-width:0;}

.field-label{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.field-label .bar{width:3px;height:11px;border-radius:2px;background:var(--accent);}
.field-body{font-size:13.5px;color:var(--ink);}
ul.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
ul.bullets li{padding-left:14px;position:relative;font-size:13.2px;color:var(--ink);}
ul.bullets li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--border-strong);}
.cautions li::before{background:var(--warn);}

.usage-box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:12.8px;}
.usage-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
.usage-row:last-child{border-bottom:none;}
.usage-row .k{flex:none;width:64px;color:var(--ink-faint);font-weight:700;font-size:11px;padding-top:1px;}
.usage-row .v{flex:1;color:var(--ink);}
.usage-row .v ul{margin:0;padding-left:16px;}
.meter{display:flex;gap:3px;margin-top:2px;}
.meter i{width:14px;height:6px;border-radius:3px;background:var(--border-strong);}
.meter i.on{background:var(--accent);}
.meter-label{font-size:11px;color:var(--ink-muted);margin-left:6px;}

/* comparison table */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
table.cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;table-layout:fixed;}
table.cmp th,table.cmp td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
table.cmp th{background:var(--surface-2);font-size:11.5px;color:var(--ink-muted);font-weight:700;position:sticky;top:0;white-space:normal;line-height:1.3;}
table.cmp th:not(:first-child){text-align:center;}
table.cmp td.rank{font-weight:700;text-align:center;}
table.cmp tr:last-child td{border-bottom:none;}
table.cmp td.rowh{font-weight:700;color:var(--ink);white-space:normal;}

/* generic reference tables */
table.ref{width:100%;border-collapse:collapse;font-size:13.3px;}
table.ref th,table.ref td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
table.ref th{background:var(--surface-2);font-size:11.5px;color:var(--ink-muted);font-weight:700;}
table.ref tr:last-child td{border-bottom:none;}
.kbd{font-family:"JetBrains Mono";background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:12px;}

.section-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px;}
.section-block h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-block h3 .bar{width:4px;height:14px;border-radius:2px;background:var(--accent);}

.tip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.tip-card{border:1px solid var(--border);border-radius:11px;padding:13px 15px;background:var(--surface);}
.tip-card .tip-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tip-card .tip-head .copy-btn{align-self:center;}
.tip-card .tip-name{font-family:"JetBrains Mono";font-weight:600;font-size:14px;color:var(--accent-ink);}
.tip-card .tip-formula{font-family:"JetBrains Mono";font-size:12px;color:var(--ink-muted);margin-top:4px;word-break:break-all;}
.tip-card .tip-desc{font-size:12.8px;margin-top:6px;}
.tip-card .tip-use{font-size:11.8px;color:var(--ink-muted);margin-top:6px;border-top:1px dashed var(--border);padding-top:6px;}

.feature-list{display:flex;flex-direction:column;gap:10px;}
.feature-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.feature-row:last-child{border-bottom:none;}

.step-list{display:flex;flex-direction:column;gap:16px;}
.step-item{display:flex;gap:14px;align-items:flex-start;}
.step-item .stepnum{
  flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--surface);
  display:flex;align-items:center;justify-content:center;font-family:"Zen Maru Gothic";font-weight:700;font-size:14px;margin-top:1px;
}
.step-item .stepbody{padding-top:2px;min-width:0;}
.step-item .stepbody .stitle{font-weight:700;font-size:14px;margin-bottom:3px;}
.step-item .stepbody .sdesc{font-size:13.3px;color:var(--ink-muted);}
.step-arrow{margin-left:14px;color:var(--ink-faint);font-size:14px;line-height:1;}
.step-flow{font-size:13px;color:var(--ink-muted);line-height:1.9;margin-bottom:18px;}
.step-item .stepbody code{background:var(--code-bg);border:1px solid var(--code-border);border-radius:5px;padding:1px 6px;font-size:12.5px;color:var(--code-fn);}

.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.glossary-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface);}
.glossary-card .gterm{font-weight:700;font-size:13.8px;color:var(--accent-ink);}
.glossary-card .gdesc{font-size:12.6px;color:var(--ink-muted);margin-top:4px;}

.callout{
  display:flex;gap:10px;background:var(--accent-soft);border:1px solid var(--accent-soft-strong);
  border-radius:10px;padding:13px 15px;font-size:13.2px;color:var(--ink);align-items:flex-start;
}
.callout svg{flex:none;width:18px;height:18px;color:var(--accent-ink);margin-top:1px;}
.callout b{color:var(--accent-ink);}

.errtable td.errcode{font-family:"JetBrains Mono";font-weight:700;color:var(--bad);white-space:nowrap;}
.feature-row .fname{flex:none;width:150px;font-weight:700;font-size:13px;}
.feature-row .fdesc{flex:1;font-size:13px;color:var(--ink-muted);}

.applied-card{border:1px solid var(--border);border-radius:12px;padding:18px 20px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:16px;}
.applied-title{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;gap:8px;align-items:baseline;}
.applied-title .num{font-family:"JetBrains Mono";color:var(--accent-ink);background:var(--accent-soft);border-radius:6px;padding:1px 8px;font-size:12px;}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.legend-item{display:flex;gap:10px;font-size:12.8px;align-items:flex-start;}
.legend-item .term{flex:none;font-family:"JetBrains Mono";font-weight:600;color:var(--code-fn);background:var(--code-bg);border:1px solid var(--code-border);border-radius:6px;padding:1px 7px;white-space:nowrap;}
.legend-item .exp{color:var(--ink-muted);padding-top:1px;}
.applied-desc{font-size:13.3px;color:var(--ink-muted);margin-top:6px;}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--bg);font-size:13px;padding:9px 18px;border-radius:999px;
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;z-index:50;box-shadow:var(--shadow);
}
:root[data-theme="dark"] .toast, @media (prefers-color-scheme: dark){ .toast{} }
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-faint);}
.empty-state svg{width:40px;height:40px;margin-bottom:10px;opacity:.6;}

.compat-flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;margin:4px 0 14px;color:var(--ink-muted);}
.compat-flow .pill{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-family:"JetBrains Mono";font-size:12px;}

.prompt-block{
  margin-top:14px;background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;
  padding:16px 18px;position:relative;font-size:13.6px;line-height:1.95;color:var(--ink);
  display:flex;flex-direction:column;gap:10px;
}
.prompt-block .prompt-text{white-space:pre-wrap;}
.prompt-block .ph{
  background:var(--accent-soft);color:var(--accent-ink);border-radius:4px;padding:0 4px;font-weight:700;
  box-shadow:0 0 0 1px var(--accent-soft-strong);
}
.prompt-legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-muted);margin-top:10px;}
.prompt-legend .ph{padding:1px 6px;}

@media (max-width:880px){
  .sidebar{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);}
  .sidebar.open{transform:translateX(0);}
  .main{padding:20px 18px 80px;}
  .menu-btn{display:flex;}
}
.menu-btn{display:none;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:14px;font-size:13px;color:var(--ink);cursor:pointer;}
.backdrop{display:none;}
.backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;}
</style>

<div class="app">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">Σ</div>
      <div>
        <div class="name">関数ナビ</div>
        <div class="sub">スプレッドシート関数・実務マニュアル</div>
      </div>
    </div>
    <div class="theme-toggle" role="group" aria-label="表示テーマ">
      <button type="button" id="themeLightBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>ライト</button>
      <button type="button" id="themeDarkBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z"/></svg>ダーク</button>
    </div>

{id:"name-clean",cat:"text",name:"氏名のふりがな・空白除去（IF+REGEXREPLACE+SUBSTITUTE）",sheetsOnly:true,
 syntax:'IF(セル="","",SUBSTITUTE(SUBSTITUTE(REGEXREPLACE(セル,"[\\(（].*$","")," ",""),"　",""))',

 formula:`=IF(F2="","",SUBSTITUTE(SUBSTITUTE(REGEXREPLACE(F2,"[\\(（].*$","")," ",""),"　",""))`,
 formulaNote:"F2が空欄なら空欄のまま。値がある場合は、括弧書きのふりがな部分と半角・全角スペースを取り除いた氏名だけを返す",
 mechanism:"①REGEXREPLACEで「(」または「（」以降の文字列（ふりがな部分）を行末まですべて削除する（閉じ括弧が無くても、開き括弧から後ろを丸ごと削除できる）→②半角スペースをSUBSTITUTEで削除→③全角スペースをSUBSTITUTEで削除→④F2が空欄の場合はIFで空欄のまま返す。",
 points:["正規表現[\\(（]で半角「(」・全角「（」のどちらにも対応","閉じ括弧が入力し忘れられていても、開き括弧以降を丸ごと削除するため崩れない","半角・全角どちらのスペースも除去するため、表記ゆれを吸収して完全一致判定の精度が上がる"],

 usage:{purpose:"氏名データのクレンジング（完全一致判定用の正規化）",scenario:["ふりがな付きの氏名データを、他システムの氏名（ふりがな・空白なし）と突合する前処理","重複チェックや名寄せ前の表記統一"],
   merit:["半角/全角の表記ゆれ、ふりがなの有無を一括で吸収できる","閉じ括弧の入力漏れにも強い"],demerit:["本来残したい括弧内の情報も一律削除される","正規表現の記述がやや難しい"],bigdata:"○"},

{id:"name-concat",cat:"text",name:"1つのセルに入っている【姓】【名】を連結して表示する（XLOOKUP+LET+REGEXEXTRACT）",sheetsOnly:true,
 syntax:'LET(txt, XLOOKUP(検索値, 検索範囲, 戻り範囲), IFERROR(REGEXEXTRACT(txt,"【姓】([^\\n\\r]+)")&" "&REGEXEXTRACT(txt,"【名】([^\\n\\r]+)"),""))',
 oneliner:"「【姓】山田／【名】太郎」のように改行区切りで1セルにまとまった氏名データから、姓と名を取り出して連結する",
 formula:`=LET(txt,XLOOKUP($B6,'データ'!H:H,'データ'!BA:BA),IFERROR(REGEXEXTRACT(txt,"【姓】([^\\n\\r]+)")&" "&REGEXEXTRACT(txt,"【名】([^\\n\\r]+)"),""))`,
 formulaNote:"B6に該当する行を'データ'!H:Hから探し、同じ行のBA列（【姓】【名】が改行区切りで入ったセル）から「山田 太郎」のような文字列を作る",
 mechanism:"①XLOOKUPでB6に該当する行の'データ'!BA列（【姓】【名】を含むセル）を取得 →②LETでtxtという名前に一時保存 →③REGEXEXTRACTで「【姓】」の後ろの改行までの文字（[^\\n\\r]+）を取り出し、同様に「【名】」の後ろも取り出す →④2つを半角スペースで連結する →⑤該当データがない・パターンに一致しない場合はIFERRORで空白を返す。",
 points:["1セル内に複数の項目が改行区切りで詰め込まれたデータからでも、必要な部分だけを取り出せる","LETでXLOOKUPの結果を一時保存することで、同じ検索を2回書かずに済む","[^\\n\\r]+は「改行が来るまでの文字を全部取得する」という意味"],
 cautions:["「【姓】」「【名】」という見出し文字列が完全に一致していないと抽出できない","REGEXEXTRACTはGoogleスプレッドシート専用関数（Excelでは使えない）"],
 usage:{purpose:"1セルにまとまった氏名データから姓名を連結して取り出す",scenario:["フォーム回答など「【姓】〇〇／【名】△△」の形式で入ってくるデータの整形","他のデータと突合する前の氏名フォーマット統一"],
   merit:["改行区切りの項目からピンポイントで必要な部分だけ取り出せる","LETで式を整理しつつ再計算を減らせる"],demerit:["見出し文字列の表記ゆれに弱い","式が長く、初見では理解しづらい"],bigdata:"○"}},

{id:"phone-format",cat:"phone",name:"電話番号：国番号を日本国内形式に変換",sheetsOnly:true,
 syntax:"IF + REGEXMATCH + REGEXREPLACE の組み合わせ",oneliner:"海外表記の電話番号を国内形式（0始まり）に整形",
 formula:`=IF(REGEXMATCH(REGEXREPLACE(TO_TEXT(A1),"[^0-9]",""),"^(0081|81)"),"0"&REGEXREPLACE(REGEXREPLACE(TO_TEXT(A1),"[^0-9]",""),"^(0081|81)0?",""),REGEXREPLACE(TO_TEXT(A1),"[^0-9]",""))`,
 formulaNote:"数字だけに統一して国番号（0081/81）を「0」に変換（ハイフンなし）。例：「81 80-1234-5678」→「08012345678」",
 mechanism:"REGEXREPLACEで数字以外を除去し、先頭が国番号（0081/81）ならそれを除いて「0」を付け直す。国番号でなければそのまま数字化する。",
 points:["TO_TEXTで数値化・指数表記を防止してから処理する","国番号の有無をREGEXMATCHで判定してから分岐する"],
 cautions:["元の値が数値としてExcel/Sheetsに入っていると指数表記（9.012345678E9）になる場合があるためTO_TEXTが必須"],
 usage:{purpose:"海外表記の電話番号を整形",scenario:["備考欄などに入った海外形式の電話番号を国内形式へ統一"],merit:["国番号表記の揺れを自動で統一できる"],demerit:["国番号のパターンを網羅する必要がある"],bigdata:"○"},
 extra:{title:"応用パターン3選",examples:[
   {formula:`=REGEXREPLACE(IF(REGEXMATCH(REGEXREPLACE(TO_TEXT(A1),"[^0-9]",""),"^(0081|81)"),"0"&REGEXREPLACE(REGEXREPLACE(TO_TEXT(A1),"[^0-9]",""),"^(0081|81)0?",""),REGEXREPLACE(TO_TEXT(A1),"[^0-9]","")),"^(\\d{3})(\\d{4})(\\d{4})$","$1-$2-$3")`,desc:"携帯番号をハイフン付き（090-1234-5678形式）に統一。例：「81 80-1234-5678」→「080-1234-5678」"},
   {formula:`=LET(n, IF(REGEXMATCH(...),"0"&...,...), IFS(REGEXMATCH(n,"^(070|080|090|050)\\d{8}$"),REGEXREPLACE(n,"^(\\d{3})(\\d{4})(\\d{4})$","$1-$2-$3"), REGEXMATCH(n,"^0120\\d{6}$"),REGEXREPLACE(n,"^(\\d{4})(\\d{3})(\\d{3})$","$1-$2-$3"), REGEXMATCH(n,"^0570\\d{6}$"),REGEXREPLACE(n,"^(\\d{4})(\\d{3})(\\d{3})$","$1-$2-$3"), REGEXMATCH(n,"^03\\d{8}$"),REGEXREPLACE(n,"^(\\d{2})(\\d{4})(\\d{4})$","$1-$2-$3"), REGEXMATCH(n,"^06\\d{8}$"),REGEXREPLACE(n,"^(\\d{2})(\\d{4})(\\d{4})$","$1-$2-$3"), REGEXMATCH(n,"^0\\d{9}$"),REGEXREPLACE(n,"^(\\d{3})(\\d{3})(\\d{4})$","$1-$2-$3"), TRUE, n))`,desc:"固定電話も混在する場合（ハイフンあり）。携帯／フリーダイヤル(0120)／0570／東京(03)／大阪(06)／その他0始まり10桁、で桁の切り方を振り分ける。例：「0300000000」→「03-0000-0000」"},
   {formula:`=ARRAYFORMULA(IF(A2:A="","",IF(LEFT(REGEXREPLACE(TO_TEXT(A2:A),"[- 　]",""),1)="0",REGEXREPLACE(TO_TEXT(A2:A),"[- 　]",""),"0"&REGEXREPLACE(TO_TEXT(A2:A),"[- 　]",""))))`,desc:"0がない番号だけ先頭に0を付け、ハイフンやスペースも削除する（全行一括）。例：「9.012345678E9」→「09012345678」"},
 ]}},

{id:"phone-areacode",cat:"phone",name:"電話番号：市外局番マスタで正確にハイフン付与",sheetsOnly:true,
 syntax:"市外局番マスタ＋COUNTIF＋IFS の組み合わせ",oneliner:"市外局番の桁数がまちまちな固定電話に正確なハイフン位置を判定する",
 formula:`=IF(COUNTIF(市外局番!A:A,LEFT(B2,5)),LEFT(B2,5),IF(COUNTIF(市外局番!A:A,LEFT(B2,4)),LEFT(B2,4),IF(COUNTIF(市外局番!A:A,LEFT(B2,3)),LEFT(B2,3),IF(COUNTIF(市外局番!A:A,LEFT(B2,2)),LEFT(B2,2),""))))`,
 formulaNote:"電話番号の先頭から5桁一致→なければ4桁一致→3桁→2桁の順で「市外局番」シートに登録された市外局番マスタと照合する",
 mechanism:"①「市外局番マスタ」を別シートに作成（全国の市外局番を登録：03/06/011/092/075/052/09969/04992 等）→②国番号を0に正規化→③市外局番を5→4→3→2桁の順でマスタと照合して抽出→④市外局番の有無で残りの桁の切り方を決めてハイフンを挿入する。",
 points:["携帯（070/080/090/050）とフリーダイヤル(0120)・0570は固定の桁割りで処理し、それ以外は市外局番マスタで判定する","市外局番は桁数が2〜5桁まちまちなので、長い桁から順にマスタ照合する必要がある"],
 cautions:["市外局番マスタの網羅性がそのまま精度に直結する","Google Apps Script（GAS）で同等処理を書く方法もある（areaCodesを長さの降順にソートして前方一致で判定）"],
 usage:{purpose:"完全に正確なハイフン位置を自動判定する",scenario:["固定電話番号の表記統一（市外局番の桁ゆれに対応）"],merit:["市外局番の桁数が不揃いでも正確にハイフンを打てる"],demerit:["市外局番マスタの整備・保守が必要"],bigdata:"○"}},

/* =========================================================
   RENDER HELPERS
   ========================================================= */
const esc = s => (s===undefined||s===null)?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr = s => esc(s).replace(/"/g,"&quot;");

function highlightFormula(f){
  // tokenize-ish highlighter: strings, function-names(before "("), numbers, refs
  let out = esc(f);
  out = out.replace(/&quot;/g,'"');
  out = out.replace(/"([^"]*)"/g, m => `<span class="cs">${m}</span>`);
  out = out.replace(/\b([A-Z][A-Z0-9_]*)\(/g, (m,fn)=>`<span class="cf">${fn}</span>(`);
  out = out.replace(/\b(\d+(\.\d+)?)\b/g, m=>`<span class="cn">${m}</span>`);
  out = out.replace(/\b([A-Z]{1,3}\$?\d+(:\$?[A-Z]{1,3}\$?\d*)?|\$?[A-Z]{1,3}:\$?[A-Z]{1,3})\b/g, m=>{
    if(/^<span/.test(m)) return m;
    return `<span class="cr">${m}</span>`;
  });
  return out;
}

function meterHtml(sym){
  const lv = meterLevel(sym||"");
  let dots="";
  for(let i=1;i<=4;i++) dots += `<i class="${i<=lv?'on':''}"></i>`;
  return `<div style="display:flex;align-items:center;"><div class="meter">${dots}</div><span class="meter-label">${esc(sym)}</span></div>`;
}

function usageBox(u){
  if(!u) return "";
  const li = arr => `<ul>${(arr||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  return `<div class="usage-box">
    <div class="usage-row"><div class="k">用途</div><div class="v">${esc(u.purpose||"")}</div></div>
    ${u.scenario&&u.scenario.length?`<div class="usage-row"><div class="k">使う場面</div><div class="v">${li(u.scenario)}</div></div>`:""}
    <div class="usage-row"><div class="k">メリット</div><div class="v">${li(u.merit)}</div></div>
    <div class="usage-row"><div class="k">デメリット</div><div class="v">${li(u.demerit)}</div></div>
    <div class="usage-row"><div class="k">大量データ</div><div class="v">${meterHtml(u.bigdata)}</div></div>
  </div>`;
}

let currentCat = "search";
let searchQuery = "";

function buildNav(){
  const root = document.getElementById("navRoot");
  const groups = {};
  CATEGORY_META.forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  root.innerHTML = Object.keys(groups).map(g=>{
    const items = groups[g].map(c=>{
      const cnt = c.id in REF_RENDER ? "" : `<span class="cnt">${FUNCTIONS.filter(f=>f.cat===c.id).length}</span>`;
      return `<button type="button" class="navitem" data-cat="${c.id}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke-width="1.7">${NAV_ICONS[c.id]||""}</svg><span>${esc(c.label)}</span>${cnt}</button>`;
    }).join("");
    return `<div class="navgroup"><div class="navgroup-label">${esc(g)}</div>${items}</div>`;
  }).join("");
  root.querySelectorAll(".navitem").forEach(el=>{
    el.addEventListener("click", ()=>{ searchQuery=""; document.getElementById("searchInput").value=""; setCategory(el.dataset.cat); closeSidebarMobile(); });
  });
}

function setCategory(cat){
  currentCat = cat;
  document.querySelectorAll(".navitem").forEach(el=>el.classList.toggle("active", el.dataset.cat===cat));
  render();
  window.scrollTo({top:0,behavior:"instant"});
}

function matchFn(fn, q){
  if(!q) return true;
  const hay = [fn.name, fn.oneliner, fn.syntax, fn.mechanism, (fn.points||[]).join(" "), (fn.cautions||[]).join(" "), fn.usage&&fn.usage.purpose, (fn.usage&&fn.usage.scenario||[]).join(" ")].join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}

function renderSearchResults(q){
  const results = FUNCTIONS.filter(f=>matchFn(f,q));
  let extraHits = [];
  const ql = q.toLowerCase();
  HANDY_TIPS.forEach(t=>{ if((t.name+t.desc+t.use).toLowerCase().includes(ql)) extraHits.push({type:"handy",label:t.name,sub:t.desc}); });
  APPLIED.forEach((a,i)=>{ if((a.title+a.desc).toLowerCase().includes(ql)) extraHits.push({type:"applied",label:a.title,sub:"応用編 例"+(i+1), idx:i}); });

  document.getElementById("searchMeta").textContent = q ? `${results.length + extraHits.length} 件ヒット` : "";

  if(!results.length && !extraHits.length){
    return `<div class="page-head"><div class="eyebrow"><span class="dot"></span>検索結果</div><h1 class="page-title">「${esc(q)}」の検索結果</h1></div>
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div>一致する関数が見つかりませんでした</div>
    </div>`;
  }
  const extraHtml = extraHits.length ? `<div class="section-block"><h3><span class="bar"></span>関連する参考資料</h3>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${extraHits.map(h=>`<button type="button" class="navitem" style="background:var(--surface-2);border-color:var(--border);" data-jump="${h.type}" data-idx="${h.idx||0}"><span style="font-weight:700;">${esc(h.label)}</span><span class="cnt" style="margin-left:8px;font-family:inherit;">${esc(h.sub)}</span></button>`).join("")}
    </div></div>` : "";

  return `<div class="page-head">
    <div class="eyebrow"><span class="dot"></span>検索結果</div>
    <h1 class="page-title">「${esc(q)}」の検索結果</h1>
    <div class="page-desc">${results.length + extraHits.length} 件見つかりました</div>
  </div>
  ${extraHtml}
  <div class="fn-grid">${results.map(fnCard).join("")}</div>`;
}

function render(){
  const content = document.getElementById("content");
  if(searchQuery){
    content.innerHTML = renderSearchResults(searchQuery);
  } else if(REF_RENDER[currentCat]){
    content.innerHTML = REF_RENDER[currentCat]();
  } else {
    content.innerHTML = renderCategory(currentCat);
  }
  bindCopyButtons();
  content.querySelectorAll("[data-jump]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const type = el.dataset.jump;
      searchQuery=""; document.getElementById("searchInput").value="";
      setCategory(type);
    });
  });
}

function bindCopyButtons(){
  document.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const text = btn.dataset.copy;
      try{
        await navigator.clipboard.writeText(text);
        showToast("数式をコピーしました");
      }catch(e){
        try{
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
          document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); document.body.removeChild(ta);
          showToast("数式をコピーしました");
        }catch(e2){ showToast("コピーできませんでした"); }
      }
    });
  });
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 1600);
}

/* search input */
document.getElementById("searchInput").addEventListener("input", (e)=>{
  searchQuery = e.target.value.trim();
  document.querySelectorAll(".navitem").forEach(el=>el.classList.remove("active"));
  render();
});

/* mobile sidebar */
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("backdrop");

backdrop.addEventListener("click", closeSidebarMobile);
function closeSidebarMobile(){ sidebar.classList.remove("open"); backdrop.classList.remove("show"); }

/* theme toggle (light/dark, persisted per browser) */
const THEME_KEY = "kansu-nabi-theme";
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme==="dark" ? "dark" : "light");
  document.getElementById("themeLightBtn").classList.toggle("active", theme!=="dark");
  document.getElementById("themeDarkBtn").classList.toggle("active", theme==="dark");
}
function setTheme(theme){ localStorage.setItem(THEME_KEY, theme); applyTheme(theme); }
document.getElementById("themeLightBtn").addEventListener("click", ()=>setTheme("light"));
document.getElementById("themeDarkBtn").addEventListener("click", ()=>setTheme("dark"));
applyTheme(localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light");

buildNav();
setCategory("guide");
document.getElementById("sidebarFoot").textContent = `元データ：関数.xlsx を移植 ／ 関数${FUNCTIONS.length}件＋実践ガイド・参考資料`;
</script>
